<!DOCTYPE html>
<html lang="gl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Erro 404 - Visor 3D Didáctico</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Creado por Rubén Ramos Loureiro - Mestrado Universitario en Profesorado de ESO e Bacharelato, F.P. e Ensino de Idiomas - Universidade da Coruña - 2026 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --moss-base: #636B2F;
            --moss-light: #8a9443;
            --moss-soft: #dce0cc;
            --bg-page: #f4f5ee;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh; /* Adaptación a iOS/iPadOS */
            background-color: var(--bg-page);
            color: var(--moss-base);
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden; 
            overflow-y: auto; /* Permite facer scroll se o contido é máis alto que a pantalla */
        }

        /* --- CONTEDOR PRINCIPAL --- */
        .main-container {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 100%;
            min-height: 100dvh; /* Adaptación a iOS/iPadOS */
            padding: 5%;
            box-sizing: border-box;
            z-index: 10;
        }

        /* --- TÍTULO --- */
        .top-title {
            text-align: right;
            width: 100%;
            z-index: 10;
        }

        .top-title h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem); 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .title-line {
            width: 150px;
            height: 4px;
            background: var(--moss-light);
            display: inline-block;
            margin-top: 5px;
        }

        /* --- MODELO 3D  --- */
        .bg-model-container {
            position: absolute;
            top: 50%;
            right: 0%; 
            transform: translateY(-50%);
            width: 70%;
            height: 80%;
            z-index: 1;
            pointer-events: auto;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            outline: none;
            --progress-bar-height: 0px;
        }

        /* --- MENÚ DE OPCIÓNS / ERRO --- */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 450px;
            width: 100%;
            z-index: 25;
            margin-top: auto;
            margin-bottom: auto;
        }

        .error-message {
            margin-bottom: 20px;
        }

        .error-message h2 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .error-message p {
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .option-card {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: none;
            border-left: 5px solid var(--moss-base);
            padding: 20px;
            text-align: left;
            text-decoration: none;
            color: var(--moss-base);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .option-card:hover {
            background-color: var(--moss-base);
            color: var(--bg-page);
            transform: translateX(10px);
            border-left-color: var(--moss-light);
        }

        .option-label {
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--moss-light);
            display: block;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .option-card:hover .option-label {
            color: var(--moss-soft);
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .option-desc {
            font-size: 0.8rem;
            font-style: italic;
            margin: 0;
            opacity: 0.8;
        }

        .version-info {
            font-size: 0.7rem; 
            opacity: 0.5; 
            letter-spacing: 1px;
            z-index: 10;
        }

        /* --- DESEÑO RESPONSIVE --- */
        
        /* Ajuste específico para Tabletas (iPads en horizontal e vertical) */
        @media (max-width: 1024px) {
            .bg-model-container {
                width: 55%; /* Reducimos o ancho do modelo para que non pise o texto */
            }
            .options-container {
                max-width: 40%; /* Adaptamos o menú ao espazo libre */
            }
        }

        /* Ajuste para móbiles */
        @media (max-width: 768px) {
            .main-container { 
                padding: 5% 5%; 
                justify-content: space-between;
                min-height: 100dvh;
            }
            .top-title { text-align: center; order: 1; }
            .bg-model-container {
                position: relative;
                top: auto;
                right: auto;
                transform: none;
                width: 100%;
                height: 35dvh; 
                min-height: 250px;
                order: 2; 
                margin: 10px 0;
                z-index: 10;
            }
            .options-container { 
                max-width: 100%; 
                margin: 0 0 15px 0; 
                order: 3; 
            }
            .version-info { text-align: center; order: 4; padding-bottom: 20px; }
            .option-card:hover { transform: translateY(-2px); }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="top-title">
            <h1>ERROR 404</h1>
            <div class="title-line"></div>
        </div>

        <div class="bg-model-container">
            <model-viewer
                id="menu-robot"
                src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
                animation-name="Death"
                camera-controls
                interaction-prompt="none"
                shadow-intensity="0"
                exposure="1"
                scale="1.4 1.4 1.4"
                camera-orbit="30deg 75deg 105%"
                loading="eager">
            </model-viewer>
        </div>

        <div class="options-container">
            <div class="error-message">
                <h2>¡Vaites!<br>Algo saíu mal.</h2>
                <p>A páxina que buscas non existe ou foi movida de sitio. O noso robot colapsou intentando atopala.</p>
            </div>

            <a href="index.html" class="option-card">
                <span class="option-label">Sistema</span>
                <h2 class="option-title">Volver ao Inicio</h2>
                <p class="option-desc">Regresa ao menú principal do visor 3D didáctico.</p>
            </a>
        </div>

        <div class="version-info">V0.18 // r4m0s</div>

    </div>

    <script>
        const modelViewer = document.querySelector('#menu-robot');
        
        modelViewer.addEventListener('load', () => {
            modelViewer.play();
            
            const checkAnimation = () => {
                const duration = modelViewer.duration;
                if (duration > 0 && modelViewer.currentTime >= duration - 0.15) {
                    modelViewer.pause(); 
                    modelViewer.currentTime = duration - 0.15; 
                    
                    setTimeout(() => {
                        modelViewer.currentTime = 0; 
                        modelViewer.play(); 
                        requestAnimationFrame(checkAnimation); 
                    }, 5000);
                } else {
                    requestAnimationFrame(checkAnimation);
                }
            };

            requestAnimationFrame(checkAnimation);
        });

        // --- PALETAS CORES COORDINADAS ---
        const palettes = [
            [[0.2, 0.1, 0.4, 1], [0.9, 0.4, 0.1, 1], [0.95, 0.75, 0.2, 1]],        
            [[0.1, 0.25, 0.2, 1], [0.3, 0.5, 0.5, 1], [0.65, 0.75, 0.65, 1]],       
            [[0.05, 0.15, 0.3, 1], [0.8, 0.35, 0.2, 1], [0.9, 0.8, 0.65, 1]]
        ];
        let currentPaletteIndex = 0;

        setInterval(() => {
            if (modelViewer?.model) {
                const palette = palettes[currentPaletteIndex];
                modelViewer.model.materials.forEach((m, i) => {
                    m.pbrMetallicRoughness.setBaseColorFactor(palette[i % palette.length]);
                });
                currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            }
        }, 10000);
    </script>
</body>
</html>
