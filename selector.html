<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Principal - Visor 3D</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --moss-base: #636B2F;
            --moss-light: #8a9443;
            --moss-soft: #dce0cc;
            --bg-page: #f4f5ee;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            overscroll-behavior: none;
            background-color: var(--bg-page);
            color: var(--moss-base);
            font-family: 'Segoe UI', sans-serif;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5%;
            z-index: 10;
        }

        /* --- TÍTULO (Estilo Carga.html) --- */
        .top-title {
            text-align: right;
            max-width: 100%;
        }

        .top-title h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem); 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .title-line {
            width: 150px;
            height: 4px;
            background: var(--moss-light);
            display: inline-block;
            margin-top: 5px;
        }

        /* --- MENÚ DE OPCIONES --- */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            width: 100%;
            z-index: 25;
            margin-top: auto;
            margin-bottom: auto;
        }

        .option-card {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border: none;
            border-left: 5px solid var(--moss-base);
            padding: 20px;
            text-align: left;
            text-decoration: none;
            color: var(--moss-base);
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .option-card:hover {
            background-color: var(--moss-base);
            color: var(--bg-page);
            transform: translateX(10px);
            border-left-color: var(--moss-light);
        }

        .option-label {
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--moss-light);
            display: block;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .option-card:hover .option-label {
            color: var(--moss-soft);
        }

        .option-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .option-desc {
            font-size: 0.8rem;
            font-style: italic;
            margin: 0;
            opacity: 0.8;
        }

        /* --- MODELO 3D DE FONDO (Para mantener estética) --- */
        .bg-model-container {
            position: absolute;
            top: 50%;
            right: -10%; 
            transform: translateY(-50%);
            width: 70%;
            height: 80%;
            z-index: 1;
            pointer-events: auto;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            outline: none;
            --progress-bar-height: 0px;
        }

        /* --- ADAPTACIÓN MÓVIL --- */
        @media (max-width: 768px) {
            .main-container {
                justify-content: flex-start;
                gap: 30px;
                overflow-y: auto !important;
            }
            .top-title {
                text-align: center;
            }
            .options-container {
                max-width: 100%;
                margin: 0;
            }
            .bg-model-container {
                position: relative;
                transform: none;
                top: 0;
                right: 0;
                width: 100%;
                height: 35vh;
                margin-top: auto;
            }
            .option-card:hover {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>

    <div class="bg-model-container">
        <model-viewer
            id="menu-robot"
            src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
            autoplay
            animation-name="Wave"
            camera-controls
            interaction-prompt="none"
            shadow-intensity="1.5"
            exposure="1"
            scale="1.4 1.4 1.4"
            camera-orbit="30deg 75deg 105%"
            loading="eager">
        </model-viewer>
    </div>

    <div class="main-container">
        
        <div class="top-title">
            <h1>v3DD</h1>
            <div class="title-line"></div>
        </div>

        <div class="options-container">
            
            <a href="configurador.html" class="option-card">
                <span class="option-label">Módulo 01</span>
                <h2 class="option-title">Configurador RA</h2>
                <p class="option-desc">Previsualiza e axusta o modelo en Realidade Aumentada.</p>
            </a>

            <a href="repositorio.html" class="option-card">
                <span class="option-label">Módulo 02</span>
                <h2 class="option-title">Repositorio REA</h2>
                <p class="option-desc">Explora Recursos Educativos Abertos e contidos multimedia compatibles.</p>
            </a>

            <a href="visor.html" class="option-card">
                <span class="option-label">Módulo 03</span>
                <h2 class="option-title">Visor 3D</h2>
                <p class="option-desc">Accede á visualización do REA configurado.</p>
            </a>

        </div>

        <div style="font-size: 0.7rem; opacity: 0.5; letter-spacing: 1px;">V0.18 // r4m0s</div>

    </div>
    <script>
        const modelViewer = document.querySelector('#menu-robot');
        // 2. Paletas Cores Coordinadas
        const palettes = [
            [[0.2, 0.1, 0.4, 1], [0.9, 0.4, 0.1, 1], [0.95, 0.75, 0.2, 1]],        // Atardecer Eléctrico
            [[0.1, 0.25, 0.2, 1], [0.3, 0.5, 0.5, 1], [0.65, 0.75, 0.65, 1]],       // Bosque de Niebla
            [[0.05, 0.15, 0.3, 1], [0.8, 0.35, 0.2, 1], [0.9, 0.8, 0.65, 1]]
        ];
        let currentPaletteIndex = 0;

        const colorInterval = setInterval(() => {
            if (modelViewer?.model) {
                const palette = palettes[currentPaletteIndex];
                modelViewer.model.materials.forEach((m, i) => {
                    m.pbrMetallicRoughness.setBaseColorFactor(palette[i % palette.length]);
                });
                currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            }
        }, 2000);
    </script>
</body>
</html>
