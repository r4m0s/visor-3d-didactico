<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciador do visor 3D</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Creado por Rubén Ramos Loureiro - Mestrado Universitario en Profesorado de ESO e Bacharelato, F.P. e Ensino de Idiomas - Universidade da Coruña - 2026 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --moss-base: #636B2F;
            --moss-light: #8a9443;
            --moss-soft: #dce0cc;
            --bg-page: #f4f5ee;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            overscroll-behavior: none;
            background-color: var(--bg-page);
            color: var(--moss-base);
            font-family: 'Segoe UI', sans-serif;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: var(--bg-page);
            transition: opacity 0.8s ease-in-out;
        }

        /* --- VISOR 3D --- */
        .model-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: translateX(-20%);
        }

        model-viewer {
            width: 100%;
            height: 80%;
            transform: translateY(+15%);
            outline: none;
            --progress-bar-height: 0px;
        }

        /* --- INTERFACE (UI) --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin-left: auto; 
            padding: 5%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            pointer-events: none; 
        }

        .ui-layer > div {
            pointer-events: auto;
        }

        /* --- TÍTULO --- */
        .top-title h1 {
            font-size: clamp(1.2rem, 4vw, 1.8rem); 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .title-line {
            width: 100%;
            height: 4px;
            background: var(--moss-light);
            display: block;
            margin-top: 5px;
        }

        /* --- CONSELLOS --- */
        .tips-container {
            width: 100%;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .tip-box {
            background-color: rgba(99, 107, 47, 0.05);
            padding: clamp(10px, 3vw, 20px);
            border-right: 5px solid var(--moss-base);
            transition: opacity 0.5s ease;
        }

        .tip-label {
            font-size: clamp(0.7rem, 2vw, 1rem);
            font-weight: 900;
            text-transform: uppercase;
            color: var(--moss-light);
            display: block;
            margin-bottom: 8px;
        }

        .tip-text {
            font-size: clamp(0.7rem, 3.5vw, 0.8rem); 
            line-height: 1.3;
            font-style: italic;
            font-weight: 400;
            margin: 0;
        }

        /* --- BARRA DE CARGA --- */
        .progress-container {
            width: 100%;
        }

        .progress {
            height: 12px;
            border-radius: 20px;
            background-color: var(--moss-soft);
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-bar {
            background-color: var(--moss-base) !important;
        }

        .progress-text {
            font-weight: 700;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            margin-bottom: 8px;
        }

        .version-info {
            font-size: 0.7rem; 
            opacity: 0.5; 
            letter-spacing: 1px;
        }

        /* --- ADAPTACIÓN PARA MÓVILES --- */
        @media (max-width: 768px) {
            .model-container {
                transform: translateX(0) translateY(-10%);
            }
            
            .ui-layer {
                max-width: 100%;
                align-items: center;
                text-align: center;
                justify-content: space-between;
                padding-bottom: 10%;
            }

            .title-line {
                width: 50%;
                margin: 5px auto 0 auto;
            }

            .tip-box {
                border-right: none;
                border-bottom: 3px solid var(--moss-base);
            }
        }

        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loading-screen">
        
        <div class="model-container">
            <model-viewer
                id="robot-model"
                src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
                autoplay
                animation-name="Dance"
                camera-controls
                interaction-prompt="none"
                shadow-intensity="1.5"
                exposure="1"
                scale="1.2 1.2 1.2"
                camera-orbit="0deg 75deg 105%"
                loading="eager">
            </model-viewer>
        </div>

        <div class="ui-layer">
            <div class="top-title">
                <h1 class="display-6">Visor 3D Didáctico</h1>
                <div class="title-line"></div>
            </div>

            <div class="tips-container">
                <div class="tip-box" id="tip-box">
                    <span class="tip-label">Axuda do visor</span>
                    <p class="tip-text" id="tip-content">Fai click e arrastra para orbitar arredor do modelo e velo desde calquera ángulo.</p>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-text"><span id="loading-msg">Cargando dependencias...</span> <span id="percent-text">0%</span></div>
                <div class="progress">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>
                <div class="version-info">V0.18 // r4m0s</div>
            </div>
        </div>

    </div>

    <script>
        const modelViewer = document.querySelector('#robot-model');

        // 1. Consellos dinámicos
        const tips = [
            "Fai click e arrastra para orbitar arredor do modelo e velo desde calquera ángulo.",
            "Usa a roda do rato ou pellizca a pantalla para facer zoom e ver os detalles máis preto.",
            "Usa o botón de realidade aumentada para conseguir unha experiencia inmersiva."
        ];
        let currentTip = 0;

        setInterval(() => {
            const tipBox = document.getElementById('tip-box');
            tipBox.style.opacity = 0;
            setTimeout(() => {
                currentTip = (currentTip + 1) % tips.length;
                document.getElementById('tip-content').innerText = tips[currentTip];
                tipBox.style.opacity = 1;
            }, 500);
        }, 5000);

        // 2. Paletas Cores
        const palettes = [
            [[0.2, 0.1, 0.4, 1], [0.9, 0.4, 0.1, 1], [0.95, 0.75, 0.2, 1]],        
            [[0.1, 0.25, 0.2, 1], [0.3, 0.5, 0.5, 1], [0.65, 0.75, 0.65, 1]],       
            [[0.05, 0.15, 0.3, 1], [0.8, 0.35, 0.2, 1], [0.9, 0.8, 0.65, 1]]
        ];
        let currentPaletteIndex = 0;

        const colorInterval = setInterval(() => {
            if (modelViewer?.model) {
                const palette = palettes[currentPaletteIndex];
                modelViewer.model.materials.forEach((m, i) => {
                    m.pbrMetallicRoughness.setBaseColorFactor(palette[i % palette.length]);
                });
                currentPaletteIndex = (currentPaletteIndex + 1) % palettes.length;
            }
        }, 2000);

        // Carga de dependencias
        document.addEventListener("DOMContentLoaded", () => {
            const progressBar = document.getElementById('progress-bar');
            const percentText = document.getElementById('percent-text');
            const loadingMsg = document.getElementById('loading-msg');
            const loadingScreen = document.getElementById('loading-screen');

            let elapsedTime = 0;
            const totalTime = 7000;

            const updateProgress = setInterval(() => {
                elapsedTime += 100;
                let progress = (elapsedTime / totalTime) * 100;

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(updateProgress);
                    clearInterval(colorInterval);
                    loadingScreen.classList.add('fade-out');
                    setTimeout(() => { window.location.href = "selector.html"; }, 800);
                }

                progressBar.style.width = `${progress}%`;
                percentText.innerText = `${Math.floor(progress)}%`;

                if (progress <= 30) loadingMsg.innerText = "Cargando dependencias...";
                else if (progress <= 67) loadingMsg.innerText = "Cargando recursos...";
                else loadingMsg.innerText = "Cargando repositorios...";
            }, 100);
        });
    </script>
</body>
</html>
